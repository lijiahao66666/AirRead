location = /api/open-books/gutenberg/search {
    rewrite ^ /ebooks/search/ break;
    proxy_pass https://www.gutenberg.org;
    proxy_set_header Host www.gutenberg.org;
    proxy_ssl_name www.gutenberg.org;
    proxy_ssl_server_name on;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
}

location ~ ^/api/open-books/gutenberg/([0-9]+)\.epub$ {
    set $gutenberg_book_id $1;
    proxy_pass https://www.gutenberg.org/ebooks/$gutenberg_book_id.epub.noimages;
    proxy_set_header Host www.gutenberg.org;
    proxy_ssl_name www.gutenberg.org;
    proxy_ssl_server_name on;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_redirect https://www.gutenberg.org/cache/epub/ /api/open-books/gutenberg/file/;
}

location ~ ^/api/open-books/gutenberg/file/([0-9]+)/(pg[0-9]+(?:-images)?\.epub)$ {
    set $gutenberg_book_id $1;
    set $gutenberg_file_name $2;
    proxy_pass https://www.gutenberg.org/cache/epub/$gutenberg_book_id/$gutenberg_file_name;
    proxy_set_header Host www.gutenberg.org;
    proxy_ssl_name www.gutenberg.org;
    proxy_ssl_server_name on;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
}
