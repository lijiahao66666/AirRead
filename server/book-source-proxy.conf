location = /api/open-books/wikisource {
    resolver 119.29.29.29 ipv6=off valid=300s;
    resolver_timeout 5s;
    set $wikisource_upstream zh.wikisource.org;
    proxy_pass https://$wikisource_upstream/w/api.php$is_args$args;
    proxy_set_header Host $wikisource_upstream;
    proxy_ssl_name $wikisource_upstream;
    proxy_ssl_server_name on;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
}
