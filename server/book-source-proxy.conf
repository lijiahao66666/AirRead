location = /api/book-sources/chinese-catalog {
    rewrite ^ /j/subject_suggest?q=$arg_query break;
    proxy_pass https://book.douban.com;
    proxy_set_header Host book.douban.com;
    proxy_ssl_name book.douban.com;
    proxy_ssl_server_name on;
    proxy_connect_timeout 5s;
    proxy_read_timeout 12s;
    proxy_send_timeout 12s;
}

location = /api/book-sources/gutenberg {
    rewrite ^ /books/?search=$arg_query break;
    proxy_pass https://gutendex.com;
    proxy_set_header Host gutendex.com;
    proxy_set_header User-Agent 'Mozilla/5.0 (compatible; AirRead/1.0; +https://read.air-inc.top)';
    proxy_ssl_name gutendex.com;
    proxy_ssl_server_name on;
    proxy_connect_timeout 5s;
    proxy_read_timeout 12s;
    proxy_send_timeout 12s;
}
