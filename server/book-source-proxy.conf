location = /api/book-sources/classics {
    proxy_pass https://www.guwendao.net/search.aspx?type=book&value=$arg_query;
    proxy_set_header Host www.guwendao.net;
    proxy_set_header Referer https://www.guwendao.net/;
    proxy_set_header User-Agent 'Mozilla/5.0 (compatible; AirRead/1.0; +https://read.air-inc.top)';
    proxy_ssl_name www.guwendao.net;
    proxy_ssl_server_name on;
    proxy_connect_timeout 5s;
    proxy_read_timeout 12s;
    proxy_send_timeout 12s;
}

location = /api/book-sources/gutenberg {
    proxy_pass https://gutendex.com/books/?search=$arg_query;
    proxy_set_header Host gutendex.com;
    proxy_set_header User-Agent 'Mozilla/5.0 (compatible; AirRead/1.0; +https://read.air-inc.top)';
    proxy_ssl_name gutendex.com;
    proxy_ssl_server_name on;
    proxy_connect_timeout 5s;
    proxy_read_timeout 12s;
    proxy_send_timeout 12s;
}
