resolver 183.60.83.19 183.60.82.98 valid=300s ipv6=off;

location = /api/open-books/gutenberg/search {
    rewrite ^ /ebooks/search/ break;
    proxy_pass https://www.gutenberg.org;
    proxy_http_version 1.1;
    proxy_set_header Host www.gutenberg.org;
    proxy_set_header Connection "";
    proxy_set_header Accept-Encoding "";
    proxy_ssl_name www.gutenberg.org;
    proxy_ssl_server_name on;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
}

location ~ ^/api/open-books/gutenberg/([0-9]+)\.epub$ {
    rewrite ^/api/open-books/gutenberg/([0-9]+)\.epub$ /cache/epub/$1/pg$1.epub break;
    proxy_pass https://gutenberg.org;
    proxy_http_version 1.1;
    proxy_set_header Host gutenberg.org;
    proxy_set_header Connection "";
    proxy_set_header Accept-Encoding "";
    proxy_ssl_name gutenberg.org;
    proxy_ssl_server_name on;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
}

location ~ ^/api/open-books/gutenberg/file/([0-9]+)/(pg[0-9]+(?:-images)?\.epub)$ {
    rewrite ^/api/open-books/gutenberg/file/([0-9]+)/(pg[0-9]+(?:-images)?\.epub)$ /cache/epub/$1/$2 break;
    proxy_pass https://gutenberg.org;
    proxy_http_version 1.1;
    proxy_set_header Host gutenberg.org;
    proxy_set_header Connection "";
    proxy_set_header Accept-Encoding "";
    proxy_ssl_name gutenberg.org;
    proxy_ssl_server_name on;
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
}
